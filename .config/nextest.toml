# These projection fixtures exercise real deadline and latency contracts. Give
# each the profile's execution slots so concurrent SQLite/archive fixtures do not
# turn resource contention into a timing failure; keep every original assertion.
[[profile.default.overrides]]
filter = 'test(/^(api::slices::invocations_and_summary::request_compression_query_tests::summary_(projection|handler)_)|(api::slices::error_distribution_and_sse::tests::dashboard_runtime_projection_update_p95_)/)'
threads-required = "num-test-threads"

# This fixture samples process-wide write-admission counters and real proxy
# latency under an owned SQLite lock. Other tests must not alter either input.
[[profile.default.overrides]]
filter = 'test(=tests::archive_file_io::proxy_runtime_pressure::proxy_runtime_attempt_lifecycle_avoids_sqlite_admission_under_write_pressure) | test(=tests::archive_file_io::proxy_runtime_pressure::proxy_runtime_attempt_lifecycle_preserves_facts_under_current_thread_write_pressure)'
threads-required = "num-test-threads"

# This fixture checks partial publication at 150 ms and completion at 3 seconds.
# Preserve those real budgets while keeping other heavy fixtures out of its slots.
[[profile.default.overrides]]
filter = 'test(=tests::stateful_sqlite::prompt_cache_materialization_control::prompt_cache_statistics_checkpoint_budget_preserves_prefix_and_real_work_counts)'
threads-required = "num-test-threads"

# These fixtures retain real allocator, routing, hydration and scheduler deadlines.
# Reserve the original profile's slots while they run; do not stretch a deadline.
