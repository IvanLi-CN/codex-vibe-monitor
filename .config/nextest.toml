| test(=tests::stateful_sqlite::invocation_ranges::invocation_ranges_retirement_returns_only_unissued_tail)
| test(=tests::stateful_sqlite::startup_rebuild_and_retention_basics::background_startup_hourly_rollup_bootstrap_defers_when_repair_cursor_remains_pending)
| test(=tests::stateful_sqlite::startup_rebuild_and_retention_basics::startup_system_status_hydrates_while_summary_hydration_is_delayed)
| test(=tests::stateful_sqlite::routing_failover_retry_budget::resolve_pool_account_for_request_with_wait_wakes_when_a_routable_account_is_created)
| test(=tests::stateful_sqlite::routing_failover_terminal_reasoning::capture_target_pool_route_persists_attempt_rows_and_summary_fields)'''
