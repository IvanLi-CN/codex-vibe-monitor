pre-commit:
  parallel: false
  commands:
    format-web:
      glob: "web/**/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bash scripts/format-staged-files.sh web {staged_files}
      stage_fixed: true
    format-markdown:
      glob: "**/*.md"
      run: bash scripts/format-staged-files.sh markdown {staged_files}
      stage_fixed: true
    format-rust:
      glob: "*.{rs}"
      run: bash scripts/format-staged-files.sh rust {staged_files}
      stage_fixed: true
    source-quality-staged:
      run: bash scripts/check-staged-source-quality.sh

pre-push:
  parallel: false
  commands:
    source-quality:
      run: bash scripts/check-source-quality.sh
    rust-quality:
      run: cargo fmt --all -- --check && cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::too_many_arguments -A clippy::too_many_lines -A clippy::excessive_nesting

commit-msg:
  commands:
    commitlint:
      run: ./node_modules/.bin/commitlint --edit {1}

post-checkout:
  commands:
    worktree-bootstrap:
      run: 'if [ -x ./scripts/run-lefthook-hook.sh ]; then ./scripts/run-lefthook-hook.sh post-checkout; fi'
