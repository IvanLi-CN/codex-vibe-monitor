pre-commit:
  parallel: false
  jobs:
    - name: format-web
      glob:
        - "web/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
        - "web/**/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bash scripts/format-staged-files.sh web {staged_files}
    - name: format-markdown
      glob:
        - "*.md"
        - "**/*.md"
      run: bash scripts/format-staged-files.sh markdown {staged_files}
    - name: rust-staged-checks
      glob: "*.{rs}"
      group:
        parallel: false
        jobs:
          - name: format-rust
            run: bash scripts/format-staged-files.sh rust {staged_files}
          - name: check-rust-line-budget
            run: python3 .github/scripts/check_staged_rust_line_budget.py

commit-msg:
  commands:
    commitlint:
      run: ./node_modules/.bin/commitlint --edit {1}

post-checkout:
  commands:
    worktree-bootstrap:
      run: 'if [ -x ./scripts/run-lefthook-hook.sh ]; then ./scripts/run-lefthook-hook.sh post-checkout; fi'
