name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@00bbb56c1853eed577652f69678a0419c468e969
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: |
        status: failure
        workflow: ${{ github.event.workflow_run.name }}
        event: ${{ github.event.workflow_run.event }}
        branch: ${{ github.event.workflow_run.head_branch || 'unavailable' }}
        sha: ${{ github.event.workflow_run.head_sha }}
        attempt: ${{ github.event.workflow_run.run_attempt }}
        actor: ${{ github.event.workflow_run.actor.login || github.actor }}
        url: ${{ github.event.workflow_run.html_url }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@00bbb56c1853eed577652f69678a0419c468e969
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: |
        status: smoke test
        workflow: Notify failed release
        event: workflow_dispatch
        branch: ${{ github.ref_name }}
        sha: ${{ github.sha }}
        attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        note: manual notifier smoke test
