name: Observability Performance

on:
  pull_request_target:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to measure after the candidate is trusted
        required: true
        type: string
      web_test_baseline_sha:
        description: Optional old frontend SHA; routes this manual invocation exclusively to frontend A/B
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ inputs.web_test_baseline_sha && 'frontend-test-ab-dispatch' || 'observability-performance' }}-${{ github.event.pull_request.number || inputs.candidate_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend-test-ab:
    name: Frontend Test A/B dispatcher
    if: github.event_name == 'workflow_dispatch' && inputs.web_test_baseline_sha != ''
    uses: ./.github/workflows/web-test-ab.yml
    with:
      baseline_sha: ${{ inputs.web_test_baseline_sha }}
      candidate_sha: ${{ inputs.candidate_sha }}

  observability-performance-image:
    name: Observability Performance Image
    # Build once; test jobs consume this immutable image without compiling.
    if: (github.event_name == 'workflow_dispatch' && inputs.web_test_baseline_sha == '') || (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'run:observability-performance')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      candidate_repository: ${{ steps.refs.outputs.candidate_repository }}
      trusted_ref: ${{ steps.refs.outputs.trusted_ref }}
    steps:
      - name: Resolve performance sources
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$WORKFLOW_REF" = "refs/heads/main"
            candidate_repository="$REPOSITORY"
            candidate_ref="$INPUT_CANDIDATE_SHA"
            trusted_ref="$WORKFLOW_SHA"
          else
            candidate_repository="$PR_HEAD_REPOSITORY"
            candidate_ref="$PR_HEAD_SHA"
            trusted_ref="$PR_BASE_SHA"
          fi
          [[ "$candidate_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$trusted_ref" =~ ^[0-9a-f]{40}$ ]]
          printf 'candidate_repository=%s\n' "$candidate_repository" >> "$GITHUB_OUTPUT"
          printf 'candidate_ref=%s\n' "$candidate_ref" >> "$GITHUB_OUTPUT"
          printf 'trusted_ref=%s\n' "$trusted_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout performance candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.refs.outputs.candidate_repository }}
          ref: ${{ steps.refs.outputs.candidate_ref }}
          path: candidate
          persist-credentials: false

      - name: Bind candidate identity
        id: identity
        run: echo "candidate=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build exact production image
        uses: docker/build-push-action@v7
        with:
          context: candidate
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: cvm-observability:${{ steps.identity.outputs.candidate }}
          build-args: |
            APP_GIT_REVISION=${{ steps.identity.outputs.candidate }}
            APP_EFFECTIVE_VERSION=3.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=observability-performance-amd64

      - name: Export immutable candidate image
        env:
          CANDIDATE: ${{ steps.identity.outputs.candidate }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observability-image"
          docker save "cvm-observability:$CANDIDATE" | gzip -1 > "$RUNNER_TEMP/observability-image/candidate.tar.gz"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'observability-image'
          sha=os.environ['CANDIDATE']
          image=json.loads(subprocess.check_output(['docker','image','inspect','cvm-observability:'+sha],text=True))[0]
          assert image['Config']['Labels']['org.opencontainers.image.revision']==sha
          digest=hashlib.file_digest((root/'candidate.tar.gz').open('rb'),'sha256').hexdigest()
          (root/'candidate.json').write_text(json.dumps({'candidate':sha,'imageId':image['Id'],'archiveSha256':digest},indent=2)+'\n')
          PY

      - name: Upload performance candidate image
        uses: actions/upload-artifact@v7
        with:
          name: observability-image-${{ github.run_id }}
          path: ${{ runner.temp }}/observability-image/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  observability-performance:
    name: Observability Acceptance (serial bundle)
    needs: observability-performance-image
    # Add the run:observability-performance label to launch the one-shot hosted measurement.
    if: (github.event_name == 'workflow_dispatch' && inputs.web_test_baseline_sha == '') || (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'run:observability-performance')
    # One fresh VM owns runtime and all three paired experiments for exact
    # hardware identity; no compiler or parallel suite shares it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Start test wall clock
        timeout-minutes: 1
        run: |
          set -euo pipefail
          started="$(date +%s)"
          echo "OBSERVABILITY_TEST_STARTED_UTC=$started" >> "$GITHUB_ENV"

      - name: Checkout trusted acceptance harness
        timeout-minutes: 1
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.observability-performance-image.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate identity
        timeout-minutes: 1
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.observability-performance-image.outputs.candidate_repository }}
          ref: ${{ needs.observability-performance-image.outputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Verify acceptance source identities
        env:
          TRUSTED_REF: ${{ needs.observability-performance-image.outputs.trusted_ref }}
          CANDIDATE: ${{ needs.observability-performance-image.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_REF"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"

      - name: Download performance candidate image
        timeout-minutes: 1
        uses: actions/download-artifact@v7
        with:
          name: observability-image-${{ github.run_id }}
          path: ${{ runner.temp }}/observability-image

      - name: Verify and load candidate image
        env:
          CANDIDATE: ${{ needs.observability-performance-image.outputs.candidate }}
        run: |
          python3 trusted/scripts/observability-acceptance/deadline.py -- python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'observability-image'
          metadata=json.loads((root/'candidate.json').read_text())
          assert metadata['candidate']==os.environ['CANDIDATE']==subprocess.check_output(['git','-C','candidate','rev-parse','HEAD'],text=True).strip()
          archive=root/'candidate.tar.gz'
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==metadata['archiveSha256']
          subprocess.run(['docker','load','--input',str(archive)],check=True)
          image=json.loads(subprocess.check_output(['docker','image','inspect',metadata['imageId']],text=True))[0]
          assert image['Config']['Labels']['org.opencontainers.image.revision']==metadata['candidate']
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('OBSERVABILITY_IMAGE='+image['Id']+'\n')
          PY

      - name: Prepare pinned CPU sampler
        run: |
          python3 trusted/scripts/observability-acceptance/deadline.py -- bash -euo pipefail -c '
          mkdir -p "$RUNNER_TEMP/observability-tools"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            https://github.com/mstange/samply/releases/download/samply-v0.13.1/samply-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/observability-tools/samply.tar.xz"
          echo "61875daad67888798690dea3cb2748279df6ac299c5c6a857d67eed7642473d9  $RUNNER_TEMP/observability-tools/samply.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/observability-tools/samply.tar.xz" -C "$RUNNER_TEMP/observability-tools"
          echo "0ca59d520059aa2ee4db1860c732089829e75740ee75314e84d2b0ab8c90873e  $RUNNER_TEMP/observability-tools/samply-x86_64-unknown-linux-gnu/samply" | sha256sum --check
          sudo sysctl -w kernel.perf_event_paranoid=1
          '

      - name: Run candidate-bound runtime and performance acceptance
        id: acceptance
        continue-on-error: true
        env:
          CANDIDATE: ${{ needs.observability-performance-image.outputs.candidate }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 trusted/scripts/observability-acceptance/bundle.py \
            --source "$PWD/trusted" --candidate-source "$PWD/candidate" --run "$RUNNER_TEMP/observability-acceptance" \
            --agent "actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --candidate "$CANDIDATE" --image "$OBSERVABILITY_IMAGE" \
            --samply "$RUNNER_TEMP/observability-tools/samply-x86_64-unknown-linux-gnu/samply" \
            --seconds 60 --rate 5

      - name: Upload runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-part-${{ github.run_id }}-${{ github.run_attempt }}-runtime
          # Whitelist synthetic evidence; exclude token files, Compose secrets and databases.
          path: |
            ${{ runner.temp }}/observability-acceptance/runtime/runtime-card.json
            ${{ runner.temp }}/observability-acceptance/runtime/part-outcome.json
            ${{ runner.temp }}/observability-acceptance/runtime/scenarios.json
            ${{ runner.temp }}/observability-acceptance/runtime/client-failures.json
            ${{ runner.temp }}/observability-acceptance/runtime/ab-samples.json
            ${{ runner.temp }}/observability-acceptance/runtime/run-config.json
            ${{ runner.temp }}/observability-acceptance/runtime/image-identity.json
            ${{ runner.temp }}/observability-acceptance/runtime/runner-context.json
            ${{ runner.temp }}/observability-acceptance/runtime/cpu-attribution.json
            ${{ runner.temp }}/observability-acceptance/runtime/environment-admission.jsonl
            ${{ runner.temp }}/observability-acceptance/runtime/resource-observer.jsonl
            ${{ runner.temp }}/observability-acceptance/runtime/measurement-windows.json
            ${{ runner.temp }}/observability-acceptance/runtime/cpu-verified/*.manifest.json
            ${{ runner.temp }}/observability-acceptance/runtime/cpu-verified/*.json.gz
            ${{ runner.temp }}/observability-acceptance/runtime/cpu-verified/*.syms.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pair-0 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-part-${{ github.run_id }}-${{ github.run_attempt }}-pair-0
          path: |
            ${{ runner.temp }}/observability-acceptance/pair-0/runtime-card.json
            ${{ runner.temp }}/observability-acceptance/pair-0/part-outcome.json
            ${{ runner.temp }}/observability-acceptance/pair-0/scenarios.json
            ${{ runner.temp }}/observability-acceptance/pair-0/client-failures.json
            ${{ runner.temp }}/observability-acceptance/pair-0/ab-samples.json
            ${{ runner.temp }}/observability-acceptance/pair-0/run-config.json
            ${{ runner.temp }}/observability-acceptance/pair-0/image-identity.json
            ${{ runner.temp }}/observability-acceptance/pair-0/runner-context.json
            ${{ runner.temp }}/observability-acceptance/pair-0/cpu-attribution.json
            ${{ runner.temp }}/observability-acceptance/pair-0/environment-admission.jsonl
            ${{ runner.temp }}/observability-acceptance/pair-0/resource-observer.jsonl
            ${{ runner.temp }}/observability-acceptance/pair-0/measurement-windows.json
            ${{ runner.temp }}/observability-acceptance/pair-0/cpu-verified/*.manifest.json
            ${{ runner.temp }}/observability-acceptance/pair-0/cpu-verified/*.json.gz
            ${{ runner.temp }}/observability-acceptance/pair-0/cpu-verified/*.syms.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pair-1 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-part-${{ github.run_id }}-${{ github.run_attempt }}-pair-1
          path: |
            ${{ runner.temp }}/observability-acceptance/pair-1/runtime-card.json
            ${{ runner.temp }}/observability-acceptance/pair-1/part-outcome.json
            ${{ runner.temp }}/observability-acceptance/pair-1/scenarios.json
            ${{ runner.temp }}/observability-acceptance/pair-1/client-failures.json
            ${{ runner.temp }}/observability-acceptance/pair-1/ab-samples.json
            ${{ runner.temp }}/observability-acceptance/pair-1/run-config.json
            ${{ runner.temp }}/observability-acceptance/pair-1/image-identity.json
            ${{ runner.temp }}/observability-acceptance/pair-1/runner-context.json
            ${{ runner.temp }}/observability-acceptance/pair-1/cpu-attribution.json
            ${{ runner.temp }}/observability-acceptance/pair-1/environment-admission.jsonl
            ${{ runner.temp }}/observability-acceptance/pair-1/resource-observer.jsonl
            ${{ runner.temp }}/observability-acceptance/pair-1/measurement-windows.json
            ${{ runner.temp }}/observability-acceptance/pair-1/cpu-verified/*.manifest.json
            ${{ runner.temp }}/observability-acceptance/pair-1/cpu-verified/*.json.gz
            ${{ runner.temp }}/observability-acceptance/pair-1/cpu-verified/*.syms.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pair-2 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-part-${{ github.run_id }}-${{ github.run_attempt }}-pair-2
          path: |
            ${{ runner.temp }}/observability-acceptance/pair-2/runtime-card.json
            ${{ runner.temp }}/observability-acceptance/pair-2/part-outcome.json
            ${{ runner.temp }}/observability-acceptance/pair-2/scenarios.json
            ${{ runner.temp }}/observability-acceptance/pair-2/client-failures.json
            ${{ runner.temp }}/observability-acceptance/pair-2/ab-samples.json
            ${{ runner.temp }}/observability-acceptance/pair-2/run-config.json
            ${{ runner.temp }}/observability-acceptance/pair-2/image-identity.json
            ${{ runner.temp }}/observability-acceptance/pair-2/runner-context.json
            ${{ runner.temp }}/observability-acceptance/pair-2/cpu-attribution.json
            ${{ runner.temp }}/observability-acceptance/pair-2/environment-admission.jsonl
            ${{ runner.temp }}/observability-acceptance/pair-2/resource-observer.jsonl
            ${{ runner.temp }}/observability-acceptance/pair-2/measurement-windows.json
            ${{ runner.temp }}/observability-acceptance/pair-2/cpu-verified/*.manifest.json
            ${{ runner.temp }}/observability-acceptance/pair-2/cpu-verified/*.json.gz
            ${{ runner.temp }}/observability-acceptance/pair-2/cpu-verified/*.syms.json
          if-no-files-found: warn
          retention-days: 14

  observability-performance-result:
    name: Observability Performance Budget
    needs: [observability-performance-image, observability-performance]
    if: always() && needs.observability-performance-image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout trusted acceptance harness
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.observability-performance-image.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate identity
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.observability-performance-image.outputs.candidate_repository }}
          ref: ${{ needs.observability-performance-image.outputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Download isolated acceptance parts
        uses: actions/download-artifact@v7
        with:
          pattern: observability-part-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/observability-parts

      - name: Verify and aggregate all parts
        id: aggregate
        continue-on-error: true
        env:
          CANDIDATE: ${{ needs.observability-performance-image.outputs.candidate }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 trusted/scripts/observability-acceptance/aggregate.py \
            --source "$PWD/trusted" --candidate-source "$PWD/candidate" \
            --run "$RUNNER_TEMP/observability-acceptance" --parts "$RUNNER_TEMP/observability-parts" \
            --candidate "$CANDIDATE"

      - name: Classify performance acceptance
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          python3 trusted/scripts/observability-acceptance/classify.py \
            --root "$RUNNER_TEMP/observability-acceptance" --step-outcome "$ACCEPTANCE_OUTCOME"

      - name: Upload aggregated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observability-acceptance/empirical-card.json
            ${{ runner.temp }}/observability-acceptance/scenarios.json
            ${{ runner.temp }}/observability-acceptance/ab-samples.json
            ${{ runner.temp }}/observability-acceptance/ab-summary.json
          if-no-files-found: error
          retention-days: 14

  observability-diagnostics:
    name: Observability CPU Diagnosis
    needs: observability-performance-image
    # Explicit opt-in experiment; never a budget certificate and never a default PR job.
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'run:observability-performance' && (github.event.pull_request.number == 1071 || github.event.pull_request.number == 1079)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted acceptance harness
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.observability-performance-image.outputs.trusted_ref }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate identity
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.observability-performance-image.outputs.candidate_repository }}
          ref: ${{ needs.observability-performance-image.outputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Download performance candidate image
        uses: actions/download-artifact@v7
        with:
          name: observability-image-${{ github.run_id }}
          path: ${{ runner.temp }}/observability-image

      - name: Verify and load candidate image
        env:
          CANDIDATE: ${{ needs.observability-performance-image.outputs.candidate }}
        run: |
          python3 trusted/scripts/observability-acceptance/deadline.py -- python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'observability-image'
          metadata=json.loads((root/'candidate.json').read_text())
          assert metadata['candidate']==os.environ['CANDIDATE']==subprocess.check_output(['git','-C','candidate','rev-parse','HEAD'],text=True).strip()
          archive=root/'candidate.tar.gz'
          assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==metadata['archiveSha256']
          subprocess.run(['docker','load','--input',str(archive)],check=True)
          image=json.loads(subprocess.check_output(['docker','image','inspect',metadata['imageId']],text=True))[0]
          assert image['Config']['Labels']['org.opencontainers.image.revision']==metadata['candidate']
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('OBSERVABILITY_IMAGE='+image['Id']+'\n')
          PY

      - name: Prepare pinned CPU sampler
        run: |
          python3 trusted/scripts/observability-acceptance/deadline.py -- bash -euo pipefail -c '
          mkdir -p "$RUNNER_TEMP/observability-tools"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            https://github.com/mstange/samply/releases/download/samply-v0.13.1/samply-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/observability-tools/samply.tar.xz"
          echo "61875daad67888798690dea3cb2748279df6ac299c5c6a857d67eed7642473d9  $RUNNER_TEMP/observability-tools/samply.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/observability-tools/samply.tar.xz" -C "$RUNNER_TEMP/observability-tools"
          echo "0ca59d520059aa2ee4db1860c732089829e75740ee75314e84d2b0ab8c90873e  $RUNNER_TEMP/observability-tools/samply-x86_64-unknown-linux-gnu/samply" | sha256sum --check
          sudo sysctl -w kernel.perf_event_paranoid=1
          '

      - name: Run bounded CPU diagnosis
        env:
          CANDIDATE: ${{ needs.observability-performance-image.outputs.candidate }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 trusted/scripts/observability-diagnostics/run.py \
            --source "$PWD/trusted" --candidate-source "$PWD/candidate" --run "$RUNNER_TEMP/observability-diagnostics" \
            --agent "diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --candidate "$CANDIDATE" --image "$OBSERVABILITY_IMAGE" \
            --samply "$RUNNER_TEMP/observability-tools/samply-x86_64-unknown-linux-gnu/samply"

      - name: Upload bounded CPU diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          # Whitelist synthetic evidence; exclude token files, Compose secrets and databases.
          path: |
            ${{ runner.temp }}/observability-diagnostics/diagnostic-card.json
            ${{ runner.temp }}/observability-diagnostics/diagnostic-windows.json
            ${{ runner.temp }}/observability-diagnostics/cpu-timeseries.jsonl
            ${{ runner.temp }}/observability-diagnostics/scenarios.json
            ${{ runner.temp }}/observability-diagnostics/run-config.json
            ${{ runner.temp }}/observability-diagnostics/image-identity.json
            ${{ runner.temp }}/observability-diagnostics/runner-context.json
            ${{ runner.temp }}/observability-diagnostics/environment-admission.jsonl
            ${{ runner.temp }}/observability-diagnostics/resource-observer.jsonl
            ${{ runner.temp }}/observability-diagnostics/measurement-windows.json
            ${{ runner.temp }}/observability-diagnostics/profiles/*/*.manifest.json
            ${{ runner.temp }}/observability-diagnostics/profiles/*/*.json.gz
            ${{ runner.temp }}/observability-diagnostics/profiles/*/*.syms.json
          if-no-files-found: warn
          retention-days: 14
