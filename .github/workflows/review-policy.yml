name: Review Policy

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  pull_request_review:
    types:
      - submitted
      - dismissed
      - edited

concurrency:
  group: review-policy-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && format('metadata-{0}-{1}', github.event.pull_request.number, github.run_id) || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review-policy:
    name: Review Policy Gate
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve trusted quality-gates sources
        id: trusted-quality-gates
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-quality-gates"
          mkdir -p "$trusted_root/.github/scripts"
          paths=(
            ".github/quality-gates.json"
            ".github/scripts/metadata_gate.py"
          )
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          source_ref="origin/${{ github.event.pull_request.base.ref }}"
          source_kind="base-branch"
          for path in "${paths[@]}"; do
            if ! git cat-file -e "${source_ref}:${path}" 2>/dev/null; then
              echo "::error::Base branch ${{ github.event.pull_request.base.ref }} does not contain the trusted quality-gates sources required for review policy."
              exit 1
            fi
          done

          for path in "${paths[@]}"; do
            mkdir -p "$trusted_root/$(dirname "$path")"
            git show "${source_ref}:${path}" > "$trusted_root/$path"
          done

          {
            echo "source_kind=$source_kind"
            echo "source_ref=$source_ref"
            echo "metadata_script=$trusted_root/.github/scripts/metadata_gate.py"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate review policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.metadata_script }}" review

      - name: Probe metadata check origin (intentional failure)
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.pull_request.number == 1321 && github.event.pull_request.head.repo.full_name == github.repository && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, urllib.request
          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          pr = event["pull_request"]
          repository = os.environ["GITHUB_REPOSITORY"]
          assert pr["number"] == 1321 and pr["head"]["repo"]["full_name"] == repository
          assert re.fullmatch(r"[0-9a-f]{40}", pr["head"]["sha"])
          payload = {
              "name": "Repository Tooling Checks",
              "head_sha": pr["head"]["sha"],
              "status": "completed",
              "conclusion": "failure",
              "external_id": "metadata-negative-probe-" + os.environ["GITHUB_RUN_ID"],
              "output": {
                  "title": "Intentional negative probe: metadata check origin",
                  "summary": "Diagnostic failure only. No successful code-validation result is asserted. This probe must be removed before delivery.",
              },
          }
          request = urllib.request.Request(
              os.environ["GITHUB_API_URL"] + "/repos/" + repository + "/check-runs",
              data=json.dumps(payload).encode(), method="POST",
              headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.load(response)
          print(json.dumps({key: result[key] for key in ["id", "name", "conclusion"]}))
          PYTHON
