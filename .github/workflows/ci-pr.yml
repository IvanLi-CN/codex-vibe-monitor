name: CI PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-pr-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && format('metadata-{0}-{1}', github.event.pull_request.number, github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('merge-group-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORM_AMD64: linux/amd64
  PLATFORM_ARM64: linux/arm64
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Rust system dependencies
        run: |
          command -v pkg-config
          pkg-config --exists sqlite3
          test -r /usr/include/sqlite3.h

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Restore Cargo registry
        id: cargo-registry-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Cargo Clippy artifacts
        id: cargo-clippy-cache
        uses: actions/cache/restore@v5
        with:
          path: target-clippy
          key: ${{ runner.os }}-cargo-clippy-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs', 'vendor/hotpath/**', 'build.rs', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Prepare exact Cargo Clippy cache reuse
        if: ${{ steps.cargo-clippy-cache.outputs.cache-hit == 'true' }}
        run: |
          # The source-key cache proves these inputs are unchanged; checkout mtimes otherwise force Cargo to rebuild them.
          find src vendor/hotpath -type f -name '*.rs' -exec touch -d '@1' {} +
          touch -d '@1' Cargo.toml Cargo.lock rust-toolchain.toml
          for input in build.rs .cargo/config.toml; do
            if [ -f "$input" ]; then touch -d '@1' "$input"; fi
          done

      - name: Rust source quality
        id: rust-source-quality
        env:
          CARGO_BUILD_JOBS: 8
          CARGO_TARGET_DIR: target-clippy
        run: bash .github/scripts/run-rust-source-quality.sh

      - name: Save Cargo Clippy artifacts
        if: ${{ steps.rust-source-quality.outcome == 'success' && steps.cargo-clippy-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: target-clippy
          key: ${{ runner.os }}-cargo-clippy-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs', 'vendor/hotpath/**', 'build.rs', '.cargo/config.toml') }}

      - name: Save Cargo registry
        if: ${{ always() && steps.cargo-registry-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

  repository-tooling-checks:
    name: Repository Tooling Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-download-v1-${{ hashFiles('.bun-version', 'bun.lock', 'web/bun.lock', 'docs-site/bun.lock') }}

      - name: Install repo tooling
        run: bun install --frozen-lockfile

      - name: Install Lefthook for hook smoke
        run: bun install --global lefthook@2.1.10

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check Web Demo sources
        run: bun run typecheck:web

      - name: Install docs-site dependencies
        run: bun install --cwd docs-site --frozen-lockfile

      - name: Worktree bootstrap smoke
        run: bash scripts/test-worktree-bootstrap.sh

      - name: Git hook contract smoke
        run: bash scripts/test-git-hooks-contract.sh

      - name: Bun-first guard
        run: bun run check:bun-first

      - name: Check quality-gates scripts
        run: |
          python3 -m py_compile \
            .github/scripts/metadata_gate.py \
            .github/scripts/check_live_quality_gates.py \
            .github/scripts/check_quality_gates_contract.py \
            .github/scripts/check_rust_source_quality.py \
            .github/scripts/release_snapshot.py \
            .github/scripts/verify_manifest_platforms.py
          bash -n .github/scripts/build-smoke-image-with-retry.sh
          bash -n .github/scripts/run-backend-tests.sh
          bash -n .github/scripts/test-representative-scale-contract.sh
          bash -n .github/scripts/run-rust-source-quality.sh
          bash -n .github/scripts/test-rust-source-quality.sh
          bash .github/scripts/test-rust-source-quality.sh

      - name: Resolve trusted quality-gates sources
        id: trusted-quality-gates
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-quality-gates"
          mkdir -p "$trusted_root/.github/scripts"
          paths=(
            ".github/quality-gates.json"
            ".github/scripts/check_quality_gates_contract.py"
            ".github/scripts/check_live_quality_gates.py"
            ".github/scripts/metadata_gate.py"
          )
          final_topology_paths=(
            ".github/workflows/ci-pr.yml"
            ".github/workflows/ci-main.yml"
            ".github/workflows/release.yml"
          )
          source_ref="HEAD"
          source_kind="current-branch"
          supports_final_topology="true"
          base_branch=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_branch="${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            queue_prefix="refs/heads/gh-readonly-queue/"
            if [[ "${GITHUB_REF}" != "${queue_prefix}"* ]]; then
              echo "::error::merge_group ref ${GITHUB_REF} must use the gh-readonly-queue/<base_branch>/... format."
              exit 1
            fi
            queue_ref="${GITHUB_REF#"${queue_prefix}"}"
            if [[ "${queue_ref}" != */pr-* ]]; then
              echo "::error::Unable to derive the merge_group base branch from ${GITHUB_REF}."
              exit 1
            fi
            base_branch="${queue_ref%%/pr-*}"
            if [ -z "${base_branch}" ]; then
              echo "::error::Unable to derive the merge_group base branch from ${GITHUB_REF}."
              exit 1
            fi
          fi

          if [ -n "${base_branch}" ]; then
            git fetch --no-tags origin "${base_branch}"
            source_ref="origin/${base_branch}"
            source_kind="base-branch"
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              source_kind="merge-group-base-branch"
            fi
            event_name="${{ github.event_name }}"
            missing_paths=()
            for path in "${paths[@]}" "${final_topology_paths[@]}"; do
              if ! git cat-file -e "${source_ref}:${path}" 2>/dev/null; then
                missing_paths+=("${path}")
              fi
            done
            if [ "${#missing_paths[@]}" -gt 0 ]; then
              echo "::warning::Base branch ${base_branch} does not yet contain the final split-topology quality-gates sources required for ${event_name}; keeping trusted scripts pinned to base and skipping trusted final-topology checks during rollout."
              supports_final_topology="false"
              source_kind="bootstrap-compatible-base-branch"
              if [ "${{ github.event_name }}" = "merge_group" ]; then
                source_kind="merge-group-bootstrap-compatible-base-branch"
              fi
            fi

            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              changed_quality_gate_paths="$(git diff --name-only "${source_ref}...HEAD" -- "${paths[@]}" "${final_topology_paths[@]}")"
              if [ -n "${changed_quality_gate_paths}" ]; then
                echo "::notice::Same-repository PR changes quality-gates contract sources; using current branch sources to validate the updated topology."
                printf '%s\n' "${changed_quality_gate_paths}"
                source_ref="HEAD"
                source_kind="current-branch-quality-gates-change"
                supports_final_topology="true"
              fi
            fi
          fi

          for path in "${paths[@]}"; do
            mkdir -p "$trusted_root/$(dirname "$path")"
            if [ "$source_ref" = "HEAD" ]; then
              cp "$path" "$trusted_root/$path"
            else
              git show "${source_ref}:${path}" > "$trusted_root/$path"
            fi
          done

          {
            echo "source_kind=$source_kind"
            echo "source_ref=$source_ref"
            echo "supports_final_topology=$supports_final_topology"
            echo "trusted_root=$trusted_root"
            echo "declaration=$trusted_root/.github/quality-gates.json"
            echo "contract_script=$trusted_root/.github/scripts/check_quality_gates_contract.py"
            echo "live_script=$trusted_root/.github/scripts/check_live_quality_gates.py"
            echo "metadata_script=$trusted_root/.github/scripts/metadata_gate.py"
          } >> "$GITHUB_OUTPUT"

      - name: Quality-gates contract check
        if: steps.trusted-quality-gates.outputs.supports_final_topology == 'true'
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.contract_script }}" \
            --repo-root "$PWD" \
            --declaration "${{ steps.trusted-quality-gates.outputs.declaration }}" \
            --metadata-script "${{ steps.trusted-quality-gates.outputs.metadata_script }}"

      - name: Quality-gates live rules check
        if: steps.trusted-quality-gates.outputs.supports_final_topology == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        env:
          QUALITY_GATES_LIVE_RULES_MODE: require
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.live_script }}" \
            --repo "${{ github.repository }}" \
            --declaration "${{ steps.trusted-quality-gates.outputs.declaration }}"

      - name: Quality gates self-tests
        run: |
          bash .github/scripts/test-quality-gates-contract.sh
          bash .github/scripts/test-build-smoke-image-with-retry.sh
          bash .github/scripts/test-release-snapshot.sh
          bash .github/scripts/test-live-quality-gates.sh
          bash .github/scripts/test-backend-test-contract.sh
          bash .github/scripts/test-representative-scale-contract.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-postgres-acceptance.py

      - name: Observability tooling and performance evidence checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/test-observability-tools.py
          python3 scripts/test-observability-acceptance.py
          python3 scripts/test-observability-diagnostics.py

      - name: Front-end lint
        run: bun run lint:web

      - name: Docs-site lint
        run: bun run lint:docs

  frontend-tests:
    name: Front-end Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-download-v1-${{ hashFiles('.bun-version', 'bun.lock', 'web/bun.lock', 'docs-site/bun.lock') }}

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run front-end Vitest suite
        working-directory: web
        run: bun run test

      - name: Build and verify PWA icon contract
        working-directory: web
        run: |
          bun run build:pwa-test
          bun run test:pwa-assets

  storybook-accessibility-tests:
    name: Storybook Accessibility Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-download-v1-${{ hashFiles('.bun-version', 'bun.lock', 'web/bun.lock', 'docs-site/bun.lock') }}

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1-${{ hashFiles('.bun-version', 'web/package.json', 'web/bun.lock') }}

      - name: Install Playwright Chromium for Storybook
        working-directory: web
        run: bunx playwright install chromium

      - name: Run Storybook accessibility suite
        working-directory: web
        run: bun run test-storybook

  docs-demo-build:
    name: Docs & Web Demo Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-download-v1-${{ hashFiles('.bun-version', 'bun.lock', 'web/bun.lock', 'docs-site/bun.lock') }}

      - name: Install repo tooling
        run: bun install --frozen-lockfile

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install docs-site dependencies
        run: bun install --cwd docs-site --frozen-lockfile

      - name: Build Storybook static site
        working-directory: web
        run: bun run storybook:build -- --quiet

      - name: Compute DOCS_BASE
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [[ "${repo}" == "${owner}.github.io" ]]; then
            echo "DOCS_BASE=/" >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE=/${repo}/" >> "$GITHUB_ENV"
          fi

      - name: Build docs site
        shell: bash
        run: |
          set -euo pipefail
          cd docs-site
          DOCS_BASE="${DOCS_BASE}" bun run build

      - name: Build Web Demo static site
        working-directory: web
        run: VITE_DEPLOY_BASE="${DOCS_BASE}demo/" bun run demo:build

      - name: Assemble public docs site smoke check
        shell: bash
        run: |
          set -euo pipefail
          bash ./.github/scripts/assemble-pages-site.sh docs-site/doc_build web/storybook-static web/demo-dist .tmp/pages-site
          test -f .tmp/pages-site/index.html
          test -f .tmp/pages-site/storybook/index.html
          test -f .tmp/pages-site/demo/index.html
          test -f .tmp/pages-site/demo/mockServiceWorker.js
          test -f .tmp/pages-site/storybook.html
          grep -q "${DOCS_BASE}storybook.html" .tmp/pages-site/index.html

  records-overlay-e2e-producer:
    name: PR E2E Test Producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-download-v1-${{ hashFiles('.bun-version', 'bun.lock', 'web/bun.lock', 'docs-site/bun.lock') }}

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1-${{ hashFiles('.bun-version', 'web/package.json', 'web/bun.lock') }}

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install chromium

      - name: Start Vite dev server
        working-directory: web
        run: |
          bun run dev -- --host 127.0.0.1 --port 60080 > /tmp/codex-vibe-monitor-vite.log 2>&1 &
          echo $! > /tmp/codex-vibe-monitor-vite.pid

      - name: Wait for Vite readiness
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:60080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Vite dev server failed to start within 60 seconds."
          cat /tmp/codex-vibe-monitor-vite.log || true
          exit 1

      - name: Build production Web Demo for performance E2E
        working-directory: web
        run: bun run demo:build

      - name: Start production Web Demo server
        working-directory: web
        run: |
          bun run demo:preview -- --host 127.0.0.1 --port 60083 > /tmp/codex-vibe-monitor-demo.log 2>&1 &
          echo $! > /tmp/codex-vibe-monitor-demo.pid

      - name: Start performance Web Demo server
        working-directory: web
        run: |
          bun run demo:preview -- --host 127.0.0.1 --port 60084 > /tmp/codex-vibe-monitor-demo-performance.log 2>&1 &
          echo $! > /tmp/codex-vibe-monitor-demo-performance.pid

      - name: Wait for Web Demo readiness
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:60083/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Web Demo server failed to start within 60 seconds."
          cat /tmp/codex-vibe-monitor-demo.log || true
          exit 1

      - name: Wait for performance Web Demo readiness
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:60084/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Performance Web Demo server failed to start within 60 seconds."
          cat /tmp/codex-vibe-monitor-demo-performance.log || true
          exit 1

      - name: Run records overlay and Web Demo Playwright regression
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          functional_status=0
          performance_status=0
          CI_PROFILE=pr E2E_BASE_URL=http://127.0.0.1:60080 E2E_DEMO_BASE_URL=http://127.0.0.1:60083 \
            PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-functional \
            bun run test:e2e -- --config=playwright.ci.config.ts --project=fixtures-functional --project=demo-functional --workers=1 --output=test-results/functional || functional_status=$?
          CI_PROFILE=pr E2E_DEMO_BASE_URL=http://127.0.0.1:60084 E2E_PRODUCTION_BUILD=1 \
            PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-performance \
            bun run test:e2e -- --config=playwright.ci.config.ts --project=performance --workers=1 --output=test-results/performance || performance_status=$?
          exit $(( functional_status || performance_status ))

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: records-overlay-playwright-report
          path: |
            web/playwright-report-functional
            web/playwright-report-performance
            web/test-results
          if-no-files-found: ignore

      - name: Stop Vite dev server
        if: always()
        run: |
          if [ -f /tmp/codex-vibe-monitor-vite.pid ]; then
            kill "$(cat /tmp/codex-vibe-monitor-vite.pid)" || true
          fi
          if [ -f /tmp/codex-vibe-monitor-demo.pid ]; then
            kill "$(cat /tmp/codex-vibe-monitor-demo.pid)" || true
          fi
          if [ -f /tmp/codex-vibe-monitor-demo-performance.pid ]; then
            kill "$(cat /tmp/codex-vibe-monitor-demo-performance.pid)" || true
          fi

  records-overlay-e2e:
    name: Records Overlay E2E
    needs: records-overlay-e2e-producer
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify E2E test producer
        env:
          PRODUCER_RESULT: ${{ needs.records-overlay-e2e-producer.result }}
        run: test "$PRODUCER_RESULT" = success

  backend-test-archive:
    name: Backend Test Archive Producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Rust system dependencies
        run: |
          command -v pkg-config
          test -r /usr/include/sqlite3.h
          command -v unzip

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - name: Restore Cargo registry
        id: cargo-registry-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Cargo test artifacts
        id: cargo-test-cache
        uses: actions/cache/restore@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-v4-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs', 'vendor/hotpath/**', 'build.rs', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-v4-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Prepare exact Cargo test cache reuse
        if: ${{ steps.cargo-test-cache.outputs.cache-hit == 'true' }}
        run: |
          # The source-key cache proves these inputs are unchanged; checkout mtimes otherwise force Cargo to rebuild them.
          find src vendor/hotpath -type f -name '*.rs' -exec touch -d '@1' {} +
          touch -d '@1' Cargo.toml Cargo.lock rust-toolchain.toml
          for input in build.rs .cargo/config.toml; do
            if [ -f "$input" ]; then touch -d '@1' "$input"; fi
          done

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.138

      - name: Build backend test archive
        id: build-backend-test-archive
        run: cargo nextest archive --locked --all-features --archive-file "$RUNNER_TEMP/backend-tests.tar.zst" --zstd-level 0

      - name: Upload backend test archive
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/backend-tests.tar.zst
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

      - name: Save Cargo registry
        if: ${{ always() && steps.cargo-registry-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

      - name: Save Cargo test artifacts
        if: ${{ steps.build-backend-test-archive.outcome == 'success' && steps.cargo-test-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: target
