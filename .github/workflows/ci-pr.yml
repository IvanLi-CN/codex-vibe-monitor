  build-pr-smoke-artifacts:
    name: PR Smoke Artifact Producer
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Rust system dependencies
        run: |
          command -v pkg-config
          test -r /usr/include/sqlite3.h
          command -v unzip

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - name: Restore Cargo registry
        id: cargo-registry-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Cargo test artifacts
        id: cargo-test-cache
        uses: actions/cache/restore@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-v4-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs', 'vendor/hotpath/**', 'build.rs', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-v4-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Prepare exact Cargo test cache reuse
        if: ${{ steps.cargo-test-cache.outputs.cache-hit == 'true' }}
        run: |
          # The source-key cache proves these inputs are unchanged; checkout mtimes otherwise force Cargo to rebuild them.
          find src vendor/hotpath -type f -name '*.rs' -exec touch -d '@1' {} +
          touch -d '@1' Cargo.toml Cargo.lock rust-toolchain.toml
          for input in build.rs .cargo/config.toml; do
            if [ -f "$input" ]; then touch -d '@1' "$input"; fi
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-download-v1-${{ hashFiles('.bun-version', 'bun.lock', 'web/bun.lock', 'docs-site/bun.lock') }}

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build PR smoke artifacts
        shell: bash
        env:
          APP_EFFECTIVE_VERSION: pr-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf .ci-smoke
          mkdir -p .ci-smoke
          xray_core_version="$(awk -F= '$1 == "ARG XRAY_CORE_VERSION" { print $2; exit }' Dockerfile)"
          test -n "$xray_core_version"
          cargo build --profile test --locked > /tmp/codex-vibe-monitor-smoke-rust.log 2>&1 &
          rust_pid=$!
          (
            cd web
            VITE_APP_VERSION="$APP_EFFECTIVE_VERSION" bunx vite build
            VITE_APP_VERSION="$APP_EFFECTIVE_VERSION" bun scripts/write-version.mjs
          ) > /tmp/codex-vibe-monitor-smoke-web.log 2>&1 &
          web_pid=$!
          (
            xray_staging_dir="$(mktemp -d)"
            xray_archive="${xray_staging_dir}/Xray-linux-64.zip"
            xray_primary_url="https://github.com/XTLS/Xray-core/releases/download/v${xray_core_version}/Xray-linux-64.zip"
            xray_fallback_url="https://downloads.sourceforge.net/project/xray-core.mirror/v${xray_core_version}/Xray-linux-64.zip"
            if ! curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL -o "$xray_archive" "$xray_primary_url"; then
              curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL -o "$xray_archive" "$xray_fallback_url"
            fi
            unzip -q "$xray_archive" -d "$xray_staging_dir/unpacked"
            install -m 0755 "$xray_staging_dir/unpacked/xray" .ci-smoke/xray
            install -m 0644 "$xray_staging_dir/unpacked/LICENSE" .ci-smoke/xray.LICENSE
          ) > /tmp/codex-vibe-monitor-smoke-xray.log 2>&1 &
          xray_pid=$!
          rust_status=0
          web_status=0
          xray_status=0
          wait "$rust_pid" || rust_status=$?
          wait "$web_pid" || web_status=$?
          wait "$xray_pid" || xray_status=$?
          if [[ "$rust_status" -ne 0 || "$web_status" -ne 0 || "$xray_status" -ne 0 ]]; then
            cat /tmp/codex-vibe-monitor-smoke-rust.log || true
            cat /tmp/codex-vibe-monitor-smoke-web.log || true
            cat /tmp/codex-vibe-monitor-smoke-xray.log || true
            exit 1
          fi
          install -m 0755 target/debug/codex-vibe-monitor .ci-smoke/codex-vibe-monitor
          cp -R web/dist .ci-smoke/web
          tar -C .ci-smoke -cf "$RUNNER_TEMP/pr-smoke-artifacts.tar" .

      - name: Upload PR smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pr-smoke-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-smoke-artifacts.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1


  build:
    name: Build Artifacts
    needs:
      - build-pr-smoke-artifacts
      - retention-migration-validation
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify smoke artifact producer
        env:
          PRODUCER_RESULT: ${{ needs.build-pr-smoke-artifacts.result }}
        run: test "$PRODUCER_RESULT" = success

      - name: Verify retention migration validation
        env:
          RETENTION_MIGRATION_RESULT: ${{ needs.retention-migration-validation.result }}
        run: test "$RETENTION_MIGRATION_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download PR smoke artifacts
        uses: actions/download-artifact@v7
        with:
          name: pr-smoke-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-smoke-artifacts

      - name: Extract PR smoke artifacts
        run: |
          mkdir .ci-smoke
          tar -C .ci-smoke -xf "$RUNNER_TEMP/pr-smoke-artifacts/pr-smoke-artifacts.tar"

      - name: Build smoke image (linux/amd64, load)
        shell: bash
        env:
          SMOKE_TAG: codex-vibe-monitor:pr-smoke-${{ github.run_id }}
          APP_EFFECTIVE_VERSION: pr-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker build \
            --target ci-smoke-runtime \
            --tag "$SMOKE_TAG" \
            --build-arg "APP_EFFECTIVE_VERSION=$APP_EFFECTIVE_VERSION" \
            .

      - name: Smoke test image (linux/amd64)
        shell: bash
        env:
          SMOKE_TAG: codex-vibe-monitor:pr-smoke-${{ github.run_id }}
          SMOKE_CONTAINER_NAME: smoke-codex-vibe-monitor-pr-${{ github.run_id }}
          SMOKE_PLATFORM: ${{ env.PLATFORM_AMD64 }}
        run: ./.github/scripts/smoke-test-image.sh "$SMOKE_TAG"

  retention-migration-validation:
    name: Retention Migration Validation
    needs: build-pr-smoke-artifacts
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect retention migration scope
        id: retention_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          required=false
          while IFS= read -r path; do
            case "$path" in
              .github/quality-gates.json|.github/scripts/check_quality_gates_contract.py|.github/workflows/ci-pr.yml|.cargo/config.toml|build.rs|Cargo.lock|Cargo.toml|Dockerfile|rust-toolchain.toml|src/*|vendor/hotpath/*|scripts/bind-retention-maintenance-candidate.py|scripts/generate-retention-maintenance-release-fixtures.py|scripts/validate-retention-maintenance-runtime.py|scripts/validate-retention-maintenance-upgrade.py|docs/adr/assets/retention-maintenance-task-ownership/*|docs/specs/retention-maintenance-task-ownership/*)
                required=true
                ;;
            esac
          done <<< "$changed_files"
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"

      - name: Verify smoke artifact producer
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        env:
          PRODUCER_RESULT: ${{ needs.build-pr-smoke-artifacts.result }}
        run: test "$PRODUCER_RESULT" = success

      - name: Download PR smoke artifacts
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: pr-smoke-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-smoke-artifacts

      - name: Extract candidate binary
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p .ci-smoke
          tar -C .ci-smoke -xf "$RUNNER_TEMP/pr-smoke-artifacts/pr-smoke-artifacts.tar"
          test -x .ci-smoke/codex-vibe-monitor
          binary_sha256="$(sha256sum .ci-smoke/codex-vibe-monitor | awk '{print $1}')"
          python3 scripts/bind-retention-maintenance-candidate.py \
            --record docs/adr/assets/retention-maintenance-task-ownership/current-candidate-validation.json \
            --github-sha "$GITHUB_SHA" \
            --binary-sha256 "$binary_sha256" \
            --output "$RUNNER_TEMP/candidate-identity.json"

      - name: Generate released-source fixtures
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        run: |
          python3 scripts/generate-retention-maintenance-release-fixtures.py \
            --output-dir "$RUNNER_TEMP/retention-migration-fixtures"

      - name: Run released-source migration validation
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        run: |
          python3 scripts/validate-retention-maintenance-upgrade.py \
            --fixtures-root "$RUNNER_TEMP/retention-migration-fixtures" \
            --candidate "$PWD/.ci-smoke/codex-vibe-monitor" \
            --output-dir "$RUNNER_TEMP/retention-migration-results"

      - name: Run runtime ownership validation
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        run: |
          python3 scripts/validate-retention-maintenance-runtime.py \
            --source-fixture "$RUNNER_TEMP/retention-migration-fixtures/v4.2.2" \
            --candidate "$PWD/.ci-smoke/codex-vibe-monitor" \
            --output-dir "$RUNNER_TEMP/retention-runtime-results" \
            --http-port 60081

      - name: Verify candidate-bound migration evidence
        if: ${{ steps.retention_scope.outputs.required == 'true' }}
        run: |
          binary_sha256="$(sha256sum .ci-smoke/codex-vibe-monitor | awk '{print $1}')"
          python3 - "$RUNNER_TEMP/candidate-identity.json" \
            "$RUNNER_TEMP/retention-migration-results/candidate.json" \
            "$RUNNER_TEMP/retention-runtime-results/results.json" \
            "$GITHUB_SHA" "$(git rev-parse HEAD)" "$binary_sha256" <<'PY'
          import json
          import sys

          identity = json.loads(open(sys.argv[1]).read())
          upgrade = json.loads(open(sys.argv[2]).read())
          runtime = json.loads(open(sys.argv[3]).read())
          github_sha = sys.argv[4]
          checkout_sha = sys.argv[5]
          binary_sha256 = sys.argv[6]
          assert identity["githubSha"] == github_sha == identity["checkoutSha"] == checkout_sha
          assert identity["candidateSha256"] == binary_sha256
          assert upgrade["candidateSha256"] == binary_sha256
          assert runtime["candidateSha256"] == binary_sha256
          print(json.dumps(identity, sort_keys=True))
          PY

      - name: Upload retention migration evidence
        if: ${{ always() && steps.retention_scope.outputs.required == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: retention-migration-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-identity.json
            ${{ runner.temp }}/retention-migration-results/candidate.json
            ${{ runner.temp }}/retention-migration-results/results.json
            ${{ runner.temp }}/retention-migration-results/*/source.json
            ${{ runner.temp }}/retention-migration-results/*/candidate.log
            ${{ runner.temp }}/retention-migration-results/*/candidate-diagnostics.jsonl
            ${{ runner.temp }}/retention-runtime-results/results.json
            ${{ runner.temp }}/retention-runtime-results/*/candidate.log
            ${{ runner.temp }}/retention-runtime-results/*/daemon.log
          if-no-files-found: error
          overwrite: true
          retention-days: 7
