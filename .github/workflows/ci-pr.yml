name: CI PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORM_AMD64: linux/amd64
  PLATFORM_ARM64: linux/arm64
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Restore legacy Cargo workspace cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Restore Cargo registry
        id: cargo-registry-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Save Cargo registry
        if: ${{ always() && steps.cargo-registry-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

  repository-tooling-checks:
    name: Repository Tooling Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install repo tooling
        run: bun install --frozen-lockfile

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check Web Demo sources
        working-directory: web
        run: bunx tsc -b

      - name: Install docs-site dependencies
        run: bun install --cwd docs-site --frozen-lockfile

      - name: Worktree bootstrap smoke
        run: bash scripts/test-worktree-bootstrap.sh

      - name: Bun-first guard
        run: bun run check:bun-first

      - name: Check quality-gates scripts
        run: |
          python3 -m py_compile \
            .github/scripts/metadata_gate.py \
            .github/scripts/check_live_quality_gates.py \
            .github/scripts/check_quality_gates_contract.py \
            .github/scripts/release_snapshot.py \
            .github/scripts/verify_manifest_platforms.py
          bash -n .github/scripts/build-smoke-image-with-retry.sh
          bash -n .github/scripts/run-backend-tests.sh

      - name: Resolve trusted quality-gates sources
        id: trusted-quality-gates
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-quality-gates"
          mkdir -p "$trusted_root/.github/scripts"
          paths=(
            ".github/quality-gates.json"
            ".github/scripts/check_quality_gates_contract.py"
            ".github/scripts/check_live_quality_gates.py"
            ".github/scripts/metadata_gate.py"
          )
          final_topology_paths=(
            ".github/workflows/ci-pr.yml"
            ".github/workflows/ci-main.yml"
            ".github/workflows/release.yml"
          )
          source_ref="HEAD"
          source_kind="current-branch"
          supports_final_topology="true"
          base_branch=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_branch="${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            queue_prefix="refs/heads/gh-readonly-queue/"
            if [[ "${GITHUB_REF}" != "${queue_prefix}"* ]]; then
              echo "::error::merge_group ref ${GITHUB_REF} must use the gh-readonly-queue/<base_branch>/... format."
              exit 1
            fi
            queue_ref="${GITHUB_REF#${queue_prefix}}"
            if [[ "${queue_ref}" != */pr-* ]]; then
              echo "::error::Unable to derive the merge_group base branch from ${GITHUB_REF}."
              exit 1
            fi
            base_branch="${queue_ref%%/pr-*}"
            if [ -z "${base_branch}" ]; then
              echo "::error::Unable to derive the merge_group base branch from ${GITHUB_REF}."
              exit 1
            fi
          fi

          if [ -n "${base_branch}" ]; then
            git fetch --no-tags origin "${base_branch}"
            source_ref="origin/${base_branch}"
            source_kind="base-branch"
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              source_kind="merge-group-base-branch"
            fi
            event_name="${{ github.event_name }}"
            missing_paths=()
            for path in "${paths[@]}" "${final_topology_paths[@]}"; do
              if ! git cat-file -e "${source_ref}:${path}" 2>/dev/null; then
                missing_paths+=("${path}")
              fi
            done
            if [ "${#missing_paths[@]}" -gt 0 ]; then
              echo "::warning::Base branch ${base_branch} does not yet contain the final split-topology quality-gates sources required for ${event_name}; keeping trusted scripts pinned to base and skipping trusted final-topology checks during rollout."
              supports_final_topology="false"
              source_kind="bootstrap-compatible-base-branch"
              if [ "${{ github.event_name }}" = "merge_group" ]; then
                source_kind="merge-group-bootstrap-compatible-base-branch"
              fi
            fi

            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              changed_quality_gate_paths="$(git diff --name-only "${source_ref}...HEAD" -- "${paths[@]}" "${final_topology_paths[@]}")"
              if [ -n "${changed_quality_gate_paths}" ]; then
                echo "::notice::Same-repository PR changes quality-gates contract sources; using current branch sources to validate the updated topology."
                printf '%s\n' "${changed_quality_gate_paths}"
                source_ref="HEAD"
                source_kind="current-branch-quality-gates-change"
                supports_final_topology="true"
              fi
            fi
          fi

          for path in "${paths[@]}"; do
            mkdir -p "$trusted_root/$(dirname "$path")"
            if [ "$source_ref" = "HEAD" ]; then
              cp "$path" "$trusted_root/$path"
            else
              git show "${source_ref}:${path}" > "$trusted_root/$path"
            fi
          done

          {
            echo "source_kind=$source_kind"
            echo "source_ref=$source_ref"
            echo "supports_final_topology=$supports_final_topology"
            echo "trusted_root=$trusted_root"
            echo "declaration=$trusted_root/.github/quality-gates.json"
            echo "contract_script=$trusted_root/.github/scripts/check_quality_gates_contract.py"
            echo "live_script=$trusted_root/.github/scripts/check_live_quality_gates.py"
            echo "metadata_script=$trusted_root/.github/scripts/metadata_gate.py"
          } >> "$GITHUB_OUTPUT"

      - name: Quality-gates contract check
        if: steps.trusted-quality-gates.outputs.supports_final_topology == 'true'
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.contract_script }}" \
            --repo-root "$PWD" \
            --declaration "${{ steps.trusted-quality-gates.outputs.declaration }}" \
            --metadata-script "${{ steps.trusted-quality-gates.outputs.metadata_script }}"

      - name: Quality-gates live rules check
        if: steps.trusted-quality-gates.outputs.supports_final_topology == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
        env:
          QUALITY_GATES_LIVE_RULES_MODE: require
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${{ steps.trusted-quality-gates.outputs.live_script }}" \
            --repo "${{ github.repository }}" \
            --declaration "${{ steps.trusted-quality-gates.outputs.declaration }}"

      - name: Quality gates self-tests
        run: |
          bash .github/scripts/test-quality-gates-contract.sh
          bash .github/scripts/test-build-smoke-image-with-retry.sh
          bash .github/scripts/test-release-snapshot.sh
          bash .github/scripts/test-live-quality-gates.sh

      - name: Front-end lint
        run: bun run lint:web

      - name: Docs-site lint
        run: bun run lint:docs

  frontend-tests:
    name: Front-end Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run front-end Vitest suite
        working-directory: web
        run: bun run test

  storybook-accessibility-tests:
    name: Storybook Accessibility Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium for Storybook
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run Storybook accessibility suite
        working-directory: web
        run: bun run test-storybook

  docs-demo-build:
    name: Docs & Web Demo Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install repo tooling
        run: bun install --frozen-lockfile

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install docs-site dependencies
        run: bun install --cwd docs-site --frozen-lockfile

      - name: Build Storybook static site
        working-directory: web
        run: bun run storybook:build -- --quiet

      - name: Compute DOCS_BASE
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [[ "${repo}" == "${owner}.github.io" ]]; then
            echo "DOCS_BASE=/" >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE=/${repo}/" >> "$GITHUB_ENV"
          fi

      - name: Build docs site
        shell: bash
        run: |
          set -euo pipefail
          cd docs-site
          DOCS_BASE="${DOCS_BASE}" bun run build

      - name: Build Web Demo static site
        working-directory: web
        run: VITE_DEPLOY_BASE="${DOCS_BASE}demo/" bun run demo:build

      - name: Assemble public docs site smoke check
        shell: bash
        run: |
          set -euo pipefail
          bash ./.github/scripts/assemble-pages-site.sh docs-site/doc_build web/storybook-static web/demo-dist .tmp/pages-site
          test -f .tmp/pages-site/index.html
          test -f .tmp/pages-site/storybook/index.html
          test -f .tmp/pages-site/demo/index.html
          test -f .tmp/pages-site/demo/mockServiceWorker.js
          test -f .tmp/pages-site/storybook.html
          grep -q "${DOCS_BASE}storybook.html" .tmp/pages-site/index.html

  records-overlay-e2e:
    name: Records Overlay E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install chromium

      - name: Start Vite dev server
        working-directory: web
        run: |
          bun run dev -- --host 127.0.0.1 --port 60080 > /tmp/codex-vibe-monitor-vite.log 2>&1 &
          echo $! > /tmp/codex-vibe-monitor-vite.pid

      - name: Wait for Vite readiness
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:60080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Vite dev server failed to start within 60 seconds."
          cat /tmp/codex-vibe-monitor-vite.log || true
          exit 1

      - name: Start mock-only Web Demo server
        working-directory: web
        run: |
          bun run demo:dev -- --host 127.0.0.1 --port 60083 > /tmp/codex-vibe-monitor-demo.log 2>&1 &
          echo $! > /tmp/codex-vibe-monitor-demo.pid

      - name: Wait for Web Demo readiness
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:60083/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Web Demo server failed to start within 60 seconds."
          cat /tmp/codex-vibe-monitor-demo.log || true
          exit 1

      - name: Run records overlay and Web Demo Playwright regression
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-records \
            bun run test:e2e -- --output=test-results/records-overlay records-filter-overlay.spec.ts
          E2E_BASE_URL=http://127.0.0.1:60083 PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-demo \
            bun run test:e2e -- --fully-parallel --workers=2 --output=test-results/demo-runtime demo-runtime.spec.ts

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: records-overlay-playwright-report
          path: |
            web/playwright-report-records
            web/playwright-report-demo
            web/test-results
          if-no-files-found: ignore

      - name: Stop Vite dev server
        if: always()
        run: |
          if [ -f /tmp/codex-vibe-monitor-vite.pid ]; then
            kill "$(cat /tmp/codex-vibe-monitor-vite.pid)" || true
          fi
          if [ -f /tmp/codex-vibe-monitor-demo.pid ]; then
            kill "$(cat /tmp/codex-vibe-monitor-demo.pid)" || true
          fi

  backend-test-archive:
    name: Backend Test Archive Producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0

      - name: Restore legacy Cargo workspace cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Restore Cargo registry
        id: cargo-registry-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Restore Cargo test artifacts
        id: cargo-test-cache
        uses: actions/cache/restore@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-v3-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-v3-${{ hashFiles('Cargo.lock') }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build backend test archive
        run: cargo nextest archive --locked --all-features --archive-file "$RUNNER_TEMP/backend-tests.tar.zst"

      - name: Upload backend test archive
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Save Cargo registry
        if: ${{ always() && steps.cargo-registry-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}

      - name: Save Cargo test artifacts
        if: ${{ always() && steps.cargo-test-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-v3-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'src/**/*.rs') }}

  backend-tests-lightweight:
    needs: backend-test-archive
    if: always()
    name: Backend Tests (Lightweight)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download backend test archive
        uses: actions/download-artifact@v7
        with:
          name: backend-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Run lightweight backend profile
        run: bash .github/scripts/run-backend-tests.sh --profile lightweight --archive-file "$RUNNER_TEMP/backend-tests.tar.zst"

  backend-tests-stateful-sqlite:
    needs: backend-test-archive
    if: always()
    name: Backend Tests (Stateful SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download backend test archive
        uses: actions/download-artifact@v7
        with:
          name: backend-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Run stateful SQLite backend profile
        run: bash .github/scripts/run-backend-tests.sh --profile stateful-sqlite --archive-file "$RUNNER_TEMP/backend-tests.tar.zst"

  backend-tests-archive-file-io:
    needs: backend-test-archive
    if: always()
    name: Backend Tests (Archive / File I/O)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download backend test archive
        uses: actions/download-artifact@v7
        with:
          name: backend-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Run archive / file I/O backend profile
        run: bash .github/scripts/run-backend-tests.sh --profile archive-file-io --archive-file "$RUNNER_TEMP/backend-tests.tar.zst"

  build:
    name: Build Artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.0

      - name: Restore legacy Cargo workspace cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install front-end dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build PR smoke artifacts
        shell: bash
        env:
          APP_EFFECTIVE_VERSION: pr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf .ci-smoke
          mkdir -p .ci-smoke
          cargo build --locked > /tmp/codex-vibe-monitor-smoke-rust.log 2>&1 &
          rust_pid=$!
          (
            cd web
            VITE_APP_VERSION="$APP_EFFECTIVE_VERSION" bunx vite build
            VITE_APP_VERSION="$APP_EFFECTIVE_VERSION" bun scripts/write-version.mjs
          ) > /tmp/codex-vibe-monitor-smoke-web.log 2>&1 &
          web_pid=$!
          rust_status=0
          web_status=0
          wait "$rust_pid" || rust_status=$?
          wait "$web_pid" || web_status=$?
          if [[ "$rust_status" -ne 0 || "$web_status" -ne 0 ]]; then
            cat /tmp/codex-vibe-monitor-smoke-rust.log || true
            cat /tmp/codex-vibe-monitor-smoke-web.log || true
            exit 1
          fi
          install -m 0755 target/debug/codex-vibe-monitor .ci-smoke/codex-vibe-monitor
          cp -R web/dist .ci-smoke/web

      - name: Build smoke image (linux/amd64, load)
        shell: bash
        env:
          SMOKE_TAG: codex-vibe-monitor:pr-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          APP_EFFECTIVE_VERSION: pr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker build \
            --target ci-smoke-runtime \
            --tag "$SMOKE_TAG" \
            --build-arg "APP_EFFECTIVE_VERSION=$APP_EFFECTIVE_VERSION" \
            .

      - name: Smoke test image (linux/amd64)
        shell: bash
        env:
          SMOKE_TAG: codex-vibe-monitor:pr-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_CONTAINER_NAME: smoke-codex-vibe-monitor-pr-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_PLATFORM: ${{ env.PLATFORM_AMD64 }}
        run: ./.github/scripts/smoke-test-image.sh "$SMOKE_TAG"
